    const attachEvents = () => {
      if (!isDiscountActive) {
        const btn = document.getElementById('apply-coupon-btn');
        const input = document.getElementById('coupon-input');
        if (btn && input) {
          btn.addEventListener('click', () => {
            const val = input.value.trim().toLowerCase();
            const myCoupons = ['live', 'copa 2026', 'copa', 'hexa2026'];
            
            if (myCoupons.includes(val)) {
              window.checkoutLinks = window.defaultLinks;
              isDiscountActive = true;
              activeCoupon = val;
              startTimer();
              render();
            } else if (window.affiliateCoupons && window.affiliateCoupons[val]) {
              window.checkoutLinks = window.affiliateCoupons[val];
              isDiscountActive = true;
              activeCoupon = val;
              startTimer();
              render();
            } else {
              alert("Cupom inválido ou expirado.");
            }
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btn.click();
          });
        }
      } else {
        const removeBtn = document.getElementById('remove-coupon-btn');
        if (removeBtn) {
          removeBtn.addEventListener('click', () => {
            isDiscountActive = false;
            activeCoupon = '';
            window.checkoutLinks = window.defaultLinks; // reset to original
            if (timerInterval) clearInterval(timerInterval);
            timerSeconds = 10 * 60;
            render();
          });
        }
      }
    };

    const render = () => {
      let wrapper = document.getElementById('custom-pricing');
      if (wrapper) {
        wrapper.innerHTML = getPricingHTML();
        attachEvents();
      }
    };

    const enforceUI = () => {
      const oldPricing = document.getElementById('pricing');
      if (!oldPricing) return;

      let wrapper = document.getElementById('custom-pricing');
      if (!wrapper) {
        wrapper = document.createElement('div');
        wrapper.id = 'custom-pricing';
        wrapper.className = 'w-full';
        wrapper.innerHTML = getPricingHTML();
        oldPricing.parentNode.insertBefore(wrapper, oldPricing.nextSibling);
        attachEvents();
      } else if (wrapper.parentNode !== oldPricing.parentNode) {
        oldPricing.parentNode.insertBefore(wrapper, oldPricing.nextSibling);
      }
    };

    // Watch for React re-renders wiping our DOM node
    const observer = new MutationObserver(() => {
      enforceUI();
    });

    observer.observe(document.body, { childList: true, subtree: true });

    // Initial check
    const interval = setInterval(() => {
      if (document.getElementById('pricing')) {
        clearInterval(interval);
        enforceUI();
      }
    }, 100);

    // Global click listener for "Começar" / "Começar Agora" buttons
    document.addEventListener('click', (e) => {
      let target = e.target;
      while (target && target !== document.body) {
        if ((target.tagName === 'BUTTON' || target.tagName === 'A') && target.innerText) {
          const text = target.innerText.trim().toLowerCase();
          if (text === 'começar' || text === 'começar agora') {
            e.preventDefault();
            const pricingSection = document.getElementById('custom-pricing');
            if (pricingSection) {
              const y = pricingSection.getBoundingClientRect().top + window.scrollY - 80;
              window.scrollTo({ top: y, behavior: 'smooth' });
            }
            return;
          }
        }
        target = target.parentNode;
      }
    });
