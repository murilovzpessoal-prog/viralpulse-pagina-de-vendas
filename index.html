<!DOCTYPE html><html lang="pt-BR" class="scroll-smooth"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralPulse - IA para TikTok Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#00F0FF', // Vivid Cyan
                50: '#e0fcff',
                100: '#b3f8ff',
                200: '#80f4ff',
                300: '#4df0ff',
                400: '#26ecff',
                500: '#00F0FF', // Main color - Cyan
                600: '#00d6e6',
                700: '#00bccc',
                800: '#00a3b3',
                900: '#008599',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0E0E11 !important;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      /* ViralPulse.att Palette Overrides */
      /* Use the exact same dark color for all dark sections to remove straight dividing lines */
      .bg-\[\#050505\] { background-color: #0E0E11 !important; }
      .bg-\[\#0A0A0A\] { background-color: #0E0E11 !important; }
      .bg-\[\#0d0d0d\] { background-color: #0E0E11 !important; }
      
      /* Cards and panels keep their specific floating colors */
      .bg-\[\#121212\] { background-color: #121216 !important; }
      .bg-\[\#1a1a1a\] { background-color: #18181B !important; }
      .bg-\[\#1f1f1f\] { background-color: #27272A !important; }
      .bg-\[\#2a2a2a\] { background-color: #3F3F46 !important; }

      /* Dual-Tone Neon Glow Mix (Cyan + Purple) */
      .bg-brand-500\/10 { background-color: rgba(176, 38, 255, 0.15) !important; } /* Deep Purple Glow */
      .bg-brand-500\/30 { background-color: rgba(176, 38, 255, 0.3) !important; }  /* Deep Purple Glow */

      /* Custom Notch Divider for White to Black transition */
      section.bg-white {
        position: relative;
      }
      section.bg-white::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 70px;
        background-color: #ffffff;
        mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,70 L200,70 C240,70 260,20 300,20 L1140,20 C1180,20 1200,70 1240,70 L1440,70 V0 H0 V70Z" fill="black"/></svg>');
        -webkit-mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,70 L200,70 C240,70 260,20 300,20 L1140,20 C1180,20 1200,70 1240,70 L1440,70 V0 H0 V70Z" fill="black"/></svg>');
        mask-size: 100% 100%;
        -webkit-mask-size: 100% 100%;
        z-index: 10;
        transform: translateY(100%);
      }
      .bg-brand-500\/10 { background-color: rgba(176, 38, 255, 0.15) !important; } /* Deep Purple Glow */
      .bg-brand-500\/30 { background-color: rgba(176, 38, 255, 0.3) !important; }  /* Deep Purple Glow */
      /* /15 and /20 will remain the natural Cyan (#00F0FF) from Tailwind */

      /* Premium Typography and Buttons */
      span.text-brand-500 {
        background: linear-gradient(135deg, #00F0FF 0%, #B026FF 100%) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
        color: transparent !important;
        font-weight: 900;
        text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      }

      button.bg-brand-500, a.bg-brand-500, div.bg-brand-500 {
        background: linear-gradient(135deg, #00F0FF 0%, #B026FF 100%) !important;
        border: none !important;
        box-shadow: 0 4px 20px -2px rgba(176, 38, 255, 0.4) !important;
        color: #fff !important;
        transition: all 0.3s ease !important;
      }
      button.bg-brand-500:hover, a.bg-brand-500:hover {
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 8px 30px -4px rgba(0, 240, 255, 0.5) !important;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-nav {
        background: rgba(5, 5, 5, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .text-gradient {
        background: linear-gradient(to right, #60a5fa, #c084fc, #f472b6); /* blue to purple to pink */
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* CUSTOM BUTTON STYLES */
      .custom-btn {
          position: relative;
          padding: 16px 40px;
          color: white;
          text-decoration: none;
          font-size: 18px;
          font-weight: 600;
          border-radius: 12px;
          overflow: hidden;
          border: none;
          cursor: pointer;
          background: linear-gradient(135deg, #3b82f6, #9333ea, #ec4899); /* Deep Blue to Purple to Pink Gradient */
          box-shadow: inset 0px -15px 20px -5px rgba(255, 255, 255, 0.35);
          transition: all 0.3s ease;
          display: inline-flex;
          align-items: center;
          justify-content: center;
      }
      
      .custom-btn::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 50%;
          height: 100%;
          background: linear-gradient(
              to right,
              transparent,
              rgba(255, 255, 255, 0.4),
              transparent
          );
          transform: skewX(-25deg);
          animation: shine 3s infinite;
          pointer-events: none;
      }

      .custom-btn:hover {
          filter: brightness(1.1);
          transform: translateY(-2px);
      }

      @keyframes shine {
          0% {
              left: -100%;
              opacity: 0;
          }
          20% {
              opacity: 1;
          }
          50%, 100% {
              left: 200%;
              opacity: 0;
          }
      }
    </style>

<link rel="stylesheet" href="/index.css">
